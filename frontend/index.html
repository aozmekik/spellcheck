<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Spellcheck</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M9 12h14M9 21l2.33-2.5 2.33 2.5 2.33-2.5 2.33 2.5 2.33-2.5 2.33 2.5' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand" aria-label="Spellcheck">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="currentColor" />
          <path
            d="M9 12h14M9 21l2.33-2.5 2.33 2.5 2.33-2.5 2.33 2.5 2.33-2.5 2.33 2.5"
            fill="none"
            stroke="#fff"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="brand-name">Spellcheck</span>
      </h1>
      <p id="status" class="status" role="status" data-state="checking">Checking…</p>
    </header>
    <main id="editor"></main>
    <footer class="hints">
      <span class="hint-pointer">Hover an underlined word for suggestions</span>
      <span class="hint-touch">Tap an underlined word for suggestions</span>
      <span class="hint-key"><kbd>F8</kbd> next issue</span>
      <span class="hint-key"><kbd id="issues-key">Ctrl+Shift+M</kbd> all issues</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
