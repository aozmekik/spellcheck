<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-label="A word is unseen, then in flight, then answered for the session. A failure pauses requests for five seconds; a refusal is final; a version change clears the answers and stale ones are ignored.">
<defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3b5bdb"/></marker></defs>
<rect x="20" y="40" width="200" height="92" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="36" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">Unseen</text>
<text x="36" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">not asked about yet</text>
<rect x="290" y="40" width="230" height="92" rx="10" fill="#eef1fb" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="306" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">In flight</text>
<text x="306" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">sorted batches of up to 1,000,</text>
<text x="306" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">at most two requests at once</text>
<rect x="590" y="40" width="200" height="92" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="606" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">Answered</text>
<text x="606" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">kept for the session</text>
<rect x="820" y="40" width="140" height="150" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="836" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#676b73">every answer is</text>
<text x="836" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#676b73">cleared and asked</text>
<text x="836" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#676b73">again; an answer</text>
<text x="836" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#676b73">from an older</text>
<text x="836" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#676b73">request is ignored</text>
<text x="836" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d1e22">Version changed?</text>
<line x1="222" y1="86" x2="288" y2="86" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<text x="255" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#676b73">request</text>
<line x1="522" y1="86" x2="588" y2="86" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<text x="555" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#676b73">200</text>
<rect x="290" y="188" width="230" height="92" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="306" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">Paused, 5 s</text>
<text x="306" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">no connection, timeout, 5xx:</text>
<text x="306" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">left alone, then asked again</text>
<line x1="405" y1="134" x2="405" y2="186" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<text x="435" y="164" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#676b73">failure</text>
<line x1="288" y1="234" x2="120" y2="234" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<line x1="120" y1="234" x2="120" y2="134" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<text x="204" y="224" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#676b73">after the pause</text>
<rect x="590" y="188" width="200" height="92" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="606" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">Refused</text>
<text x="606" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">400, 413, or a 422</text>
<text x="606" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">naming it: final</text>
<line x1="522" y1="120" x2="588" y2="212" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<text x="575" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#676b73">4xx</text>
</svg>
