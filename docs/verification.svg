<svg xmlns="http://www.w3.org/2000/svg" width="980" height="232" viewBox="0 0 980 232" role="img" aria-label="What each layer is checked against: the spell package by an oracle, a fuzzer and public misspelling sets; the HTTP layer by a test per status; the editor by unit tests and by hand; the whole by one end-to-end test.">
<defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3b5bdb"/></marker></defs>
<rect x="20" y="20" width="300" height="124" rx="10" fill="#eef1fb" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="36" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">spell</text>
<text x="36" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">index vs a full scan on 1,300 queries</text>
<text x="36" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">distance fuzzed against the textbook table</text>
<text x="36" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">670 public typos, every ranking rule measured</text>
<text x="36" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">a million words of prose for false alarms</text>
<rect x="340" y="20" width="300" height="124" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="356" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">httpapi</text>
<text x="356" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">a test per status code and its body</text>
<text x="356" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">the request ID in header, body and log line</text>
<text x="356" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">no word ever in a log line</text>
<text x="356" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">499 on a disconnect, 500 on a panic</text>
<rect x="660" y="20" width="300" height="124" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="676" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">editor</text>
<text x="676" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">unit tests: cache, tokenizer, quick fixes,</text>
<text x="676" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">status text, dictionary, draft</text>
<text x="676" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">by hand: the CodeMirror glue</text>
<text x="676" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">cut: a Playwright run of the whole journey</text>
<rect x="20" y="166" width="940" height="42" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="36" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">End to end: one test starts the real service on a free port, checks words over HTTP, then cancels it the way SIGTERM would and reads the log lines.</text>
</svg>
