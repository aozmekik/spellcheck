<svg xmlns="http://www.w3.org/2000/svg" width="980" height="376" viewBox="0 0 980 376" role="img" aria-label="Building the index: each deletion of a word's first seven letters points back to the word. Looking up a typo: its own deletions probe the same table, and the union of the rows is the candidate set.">
<defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#3b5bdb"/></marker></defs>
<text x="20" y="40" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1e22">Build, once at startup</text>
<rect x="20" y="56" width="290" height="64" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="36" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">the</text>
<text x="36" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">a word in the list</text>
<line x1="165" y1="122" x2="165" y2="148" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="20" y="150" width="290" height="110" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="36" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">Its deletions</text>
<text x="36" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">the · he · te · th · t · h · e</text>
<text x="36" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">every way of dropping up to 2 of</text>
<text x="36" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">the first 7 letters: 29 at most</text>
<line x1="312" y1="205" x2="346" y2="205" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<text x="329" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#676b73">add</text>
<rect x="350" y="56" width="280" height="300" rx="10" fill="#ffffff" stroke="#3b5bdb" stroke-width="1.5"/>
<rect x="350" y="56" width="280" height="40" rx="10" fill="#eef1fb"/>
<rect x="350" y="80" width="280" height="16" fill="#eef1fb"/>
<text x="490" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1e22">hash of a deletion → word ids</text>
<text x="372" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1e22">th</text>
<text x="410" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">→  the · this · thy · bath</text>
<line x1="362" y1="137" x2="618" y2="137" stroke="#c9ccd3" stroke-width="1"/>
<text x="372" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1e22">te</text>
<text x="410" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">→  the · ten · tea · team</text>
<line x1="362" y1="173" x2="618" y2="173" stroke="#c9ccd3" stroke-width="1"/>
<text x="372" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1e22">he</text>
<text x="410" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">→  the · he · she · her</text>
<line x1="362" y1="209" x2="618" y2="209" stroke="#c9ccd3" stroke-width="1"/>
<text x="372" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1e22">eh</text>
<text x="410" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">→  eh · meh · ETH</text>
<line x1="362" y1="245" x2="618" y2="245" stroke="#c9ccd3" stroke-width="1"/>
<text x="372" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1e22">t</text>
<text x="410" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">→  the · to · it · at · …</text>
<line x1="362" y1="281" x2="618" y2="281" stroke="#c9ccd3" stroke-width="1"/>
<text x="372" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1e22">…</text>
<text x="410" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">→  743k keys, 2.7M ids</text>
<text x="670" y="40" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1e22">Lookup, for each typed word</text>
<rect x="670" y="56" width="290" height="64" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="686" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">teh</text>
<text x="686" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">not in the list, so find candidates</text>
<line x1="815" y1="122" x2="815" y2="148" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="670" y="150" width="290" height="74" rx="10" fill="#ffffff" stroke="#c9ccd3" stroke-width="1.5"/>
<text x="686" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">Its deletions</text>
<text x="686" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">teh · eh · th · te · t · e · h</text>
<text x="686" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">probe the same table, 29 probes at most</text>
<line x1="668" y1="187" x2="634" y2="187" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<text x="651" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#676b73">probe</text>
<line x1="815" y1="226" x2="815" y2="250" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="670" y="252" width="290" height="104" rx="10" fill="#eef1fb" stroke="#3b5bdb" stroke-width="1.5"/>
<text x="686" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1e22">Candidates</text>
<text x="686" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">the union of those rows, each id once;</text>
<text x="686" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">a distance check then keeps the words</text>
<text x="686" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#676b73">within 2 edits: the, ten, tea, then …</text>
</svg>
