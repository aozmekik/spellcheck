<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-label="The editor, tokenizer and word cache in the browser; the HTTP layer and the spell package in the Go service; one POST between them.">
<defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8ea2ff"/></marker></defs>
<rect x="20" y="20" width="380" height="400" rx="14" fill="#161920" stroke="#3a3d44" stroke-width="1"/>
<text x="40" y="48" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6e7ea">Browser</text>
<text x="40" y="66" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a4ac">Vite and TypeScript, no framework</text>
<rect x="40" y="86" width="340" height="104" rx="10" fill="#1c1e22" stroke="#3a3d44" stroke-width="1.5"/>
<text x="56" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6e7ea">Editor · CodeMirror 6</text>
<text x="56" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">waits 350 ms for a pause in typing, keeps</text>
<text x="56" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">underlines on their words as the text changes;</text>
<text x="56" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">F8 or a tap opens the suggestions</text>
<rect x="40" y="206" width="340" height="74" rx="10" fill="#1c1e22" stroke="#3a3d44" stroke-width="1.5"/>
<text x="56" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6e7ea">Tokenizer</text>
<text x="56" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">decides what counts as a word; skips URLs,</text>
<text x="56" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">numbers, acronyms and mixed-case names</text>
<rect x="40" y="296" width="340" height="104" rx="10" fill="#1f2540" stroke="#8ea2ff" stroke-width="1.5"/>
<text x="56" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6e7ea">Word cache</text>
<text x="56" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">one request per new word, per session</text>
<text x="56" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">two in flight, a pause after a failure</text>
<text x="56" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">starts over when the version changes</text>
<rect x="580" y="20" width="380" height="400" rx="14" fill="#161920" stroke="#3a3d44" stroke-width="1"/>
<text x="600" y="48" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6e7ea">Go service</text>
<text x="600" y="66" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a4ac">standard library only, one static binary</text>
<rect x="600" y="86" width="340" height="104" rx="10" fill="#1c1e22" stroke="#3a3d44" stroke-width="1.5"/>
<text x="616" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6e7ea">spell</text>
<text x="616" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">107,000 US words, embedded, built in 0.3 s</text>
<text x="616" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">SymSpell index: 29 probes, then a bounded</text>
<text x="616" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">edit distance; ranked by distance and three rules</text>
<text x="600" y="222" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a4ac">spell knows nothing about HTTP; httpapi</text>
<text x="600" y="240" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a4ac">sees it through a two-method interface.</text>
<rect x="600" y="296" width="340" height="104" rx="10" fill="#1f2540" stroke="#8ea2ff" stroke-width="1.5"/>
<text x="616" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6e7ea">httpapi</text>
<text x="616" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">validates each word, at most 1,000 a request</text>
<text x="616" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">RFC 9457 problem details, request IDs</text>
<text x="616" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a4ac">logs route, status and count, never a word</text>
<line x1="402" y1="326" x2="576" y2="326" stroke="#8ea2ff" stroke-width="1.6" marker-end="url(#head)"/>
<line x1="578" y1="372" x2="404" y2="372" stroke="#8ea2ff" stroke-width="1.6" marker-end="url(#head)"/>
<text x="490" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e7ea">POST /v1/check</text>
<text x="490" y="353" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a4ac">the unseen words, sorted</text>
<text x="490" y="392" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a4ac">correct?, up to 5 fixes,</text>
<text x="490" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a0a4ac">the checker's version</text>
</svg>
